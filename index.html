    <!-- Idioma y preloader antes del primer paint (sin parpadeos) -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          if (localStorage.getItem('lang') === 'en') d.lang = 'en';
          if (
            sessionStorage.getItem('pl') ||
            matchMedia('(prefers-reduced-motion: reduce)').matches
          )
            d.classList.add('no-preload');
          sessionStorage.setItem('pl', '1');
        } catch (e) {
          d.classList.add('no-preload');
        }
      })();
    </script>
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: #07060d;
        animation: pl-out 0.4s cubic-bezier(0.7, 0, 0.3, 1) 0.45s forwards;
      }
      .no-preload #preloader {
        display: none;
      }
      #preloader .pl-inner {
        display: grid;
        gap: 14px;
        justify-items: center;
        font:
          700 15px/1 ui-monospace,
          Consolas,
          monospace;
        letter-spacing: 0.3em;
        color: #f1eefb;
      }
      #preloader .pl-bar {
        width: 120px;
        height: 2px;
        background: rgb(127 127 140 / 0.25);
        overflow: hidden;
        border-radius: 2px;
      }
      #preloader .pl-bar span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #7c3aed, #e879f9);
        box-shadow: 0 0 12px #e879f9;
        transform-origin: left;
        animation: pl-fill 0.42s cubic-bezier(0.6, 0, 0.2, 1) forwards;
        transform: scaleX(0);
      }
      @keyframes pl-fill {
        to {
          transform: scaleX(1);
        }
      }
      @keyframes pl-out {
        to {
          transform: translateY(-100%);
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
      <div class="pl-inner">
        ZM<span class="pl-bar"><span></span></span>
      </div>
    </div>
    <div id="root"><!--app-html--></div>
    <noscript>
      <style>
        #preloader {
          display: none;
        }
      </style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
