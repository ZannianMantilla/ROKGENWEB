# Publica el sitio en GitHub Pages (https://zannianmantilla.github.io/ROKGENWEB/) en cada push a main.
# En el repo: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /ROKGENWEB/
          SITE_URL: https://zannianmantilla.github.io/ROKGENWEB
          # Opcionales: Settings → Secrets and variables → Actions → Variables
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.VITE_PLAUSIBLE_DOMAIN }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
